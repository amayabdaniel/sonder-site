name: pages

on:
  # Disabled by design — only fires on a branch that doesn't exist + manual dispatch.
  # Same pattern as the other repos. Tech debt: deploys are manual until we're
  # ready to flip this back to [main].
  push:
    branches: [ci-enabled]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
